<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fab fa-spotify"></i>
                <span>Spotify</span>
            </div>
            <nav class="nav-links">
                <a href="#" class="active"><i class="fas fa-home"></i> Home</a>
                <a href="#"><i class="fas fa-search"></i> Search</a>
                <a href="#"><i class="fas fa-book"></i> Your Library</a>
            </nav>
            <div class="nav-links secondary-nav">
                <a href="#"><i class="fas fa-plus-square"></i> Create Playlist</a>
                <a href="#"><i class="fas fa-heart"></i> Liked Songs</a>
            </div>
            <div class="sidebar-divider"></div>
            <div class="playlists">
                <!-- Playlists will go here -->
                <a href="#">Chill Vibes</a>
                <a href="#">Top Hits 2023</a>
                <a href="#">Coding Focus</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="nav-arrows">
                    <button class="arrow-btn"><i class="fas fa-chevron-left"></i></button>
                    <button class="arrow-btn"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="user-profile">
                    <button class="upgrade-btn">Explore Premium</button>
                    <div class="profile-icon"><i class="far fa-user"></i></div>
                </div>
            </header>

            <div class="content-scroll">
                <h2>Good Evening</h2>
                
                <div class="cards-container" id="songs-container">
                    <!-- Song cards will be injected here by JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Bottom Player -->
    <footer class="player">
        <div class="player-left">
            <img src="https://via.placeholder.com/56" alt="Album Art" id="current-album-art" class="album-art">
            <div class="track-info">
                <div class="track-name" id="current-title">Select a song</div>
                <div class="artist-name" id="current-artist">-</div>
            </div>
            <button class="icon-btn"><i class="far fa-heart"></i></button>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="icon-btn"><i class="fas fa-random"></i></button>
                <button class="icon-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
                <button class="play-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
                <button class="icon-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
                <button class="icon-btn"><i class="fas fa-redo-alt"></i></button>
            </div>
            <div class="progress-container">
                <span class="time" id="current-time">0:00</span>
                <div class="progress-bar-wrapper" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span class="time" id="duration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <button class="icon-btn"><i class="fas fa-microphone"></i></button>
            <button class="icon-btn"><i class="fas fa-list"></i></button>
            <button class="icon-btn"><i class="fas fa-laptop-house"></i></button>
            <div class="volume-control">
                <button class="icon-btn"><i class="fas fa-volume-up"></i></button>
                <div class="progress-bar-wrapper volume-bar">
                    <div class="progress-bar" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Audio Element -->
    <audio id="audio-player"></audio>

    <script src="script.js"></script>
</body>
</html>
